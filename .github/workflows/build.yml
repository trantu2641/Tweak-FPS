
name: Build SystemFPS RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Install RootHide packaging support
        run: |
          git clone https://github.com/roothide/theos.git /tmp/roothide-theos

          if [ -d /tmp/roothide-theos ]; then
            cp -R /tmp/roothide-theos/* $HOME/theos/
          fi

      - name: Install iOS SDK
        run: |
          git clone https://github.com/theos/sdks.git /tmp/sdks

          mkdir -p $HOME/theos/sdks

          cp -R /tmp/sdks/iPhoneOS16.5.sdk \
            $HOME/theos/sdks/

      - name: Verify RootHide scheme
        run: |
          find $HOME/theos -iname '*roothide*' -print

          grep -R "roothide" \
            $HOME/theos/makefiles \
            $HOME/theos/vendor 2>/dev/null || true

      - name: Build SystemFPS
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH

          make clean

          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SystemFPS-RootHide
          path: packages/*.deb
          if-no-files-found: error
