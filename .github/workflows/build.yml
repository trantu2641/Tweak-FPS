
name: Build SystemFPS RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install make dpkg ldid xz

      - name: Install RootHide Theos
        run: |
          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install SDK
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          test -d /tmp/theos-sdks/iPhoneOS16.5.sdk

          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

      - name: Verify project structure
        run: |
          set -e

          REQUIRED_FILES=(
            Makefile
            control
            SystemFPS.plist
            Tweak.xm
            Preferences/Makefile
            Preferences/Info.plist
            Preferences/Root.plist
            Preferences/SystemFPSRootListController.h
            Preferences/SystemFPSRootListController.m
            layout/Library/PreferenceLoader/Preferences/SystemFPS.plist
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
            echo "FOUND: $FILE"
          done

      - name: Validate plist files
        run: |
          set -e

          plutil -lint SystemFPS.plist
          plutil -lint Preferences/Info.plist
          plutil -lint Preferences/Root.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/SystemFPS.plist

      - name: Build RootHide DEB
        run: |
          set -e

          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=roothide

          make clean
          make package FINALPACKAGE=1

      - name: Verify DEB
        run: |
          set -e

          DEB=$(find packages -name "*.deb" -type f | head -n 1)

          test -n "$DEB"

          mkdir -p /tmp/systemfps-check

          dpkg-deb -x "$DEB" /tmp/systemfps-check

          echo "===== PACKAGE FILES ====="
          find /tmp/systemfps-check -iname "*SystemFPS*"

          BUNDLE="/tmp/systemfps-check/Library/PreferenceBundles/SystemFPSPrefs.bundle"

          test -d "$BUNDLE"
          test -f "$BUNDLE/Info.plist"
          test -f "$BUNDLE/Root.plist"

          test -f "/tmp/systemfps-check/Library/PreferenceLoader/Preferences/SystemFPS.plist"

          echo "===== VERIFIED ====="
          plutil -lint "$BUNDLE/Info.plist"
          plutil -lint "$BUNDLE/Root.plist"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: SystemFPS-RootHide-iOS16
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
