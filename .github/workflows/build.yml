
name: Build SystemFPS RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build SystemFPS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          brew update
          brew install make dpkg ldid xz

      # 3. Install RootHide Theos
      - name: Install RootHide Theos
        shell: bash
        run: |
          set -e

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      # 4. Install iOS SDK
      - name: Install iOS SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/theos/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          if [ -d "/tmp/theos-sdks/iPhoneOS16.5.sdk" ]; then
            cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk \
              "$HOME/theos/sdks/"
          else
            echo "ERROR: iPhoneOS16.5.sdk not found"
            exit 1
          fi

          ls "$HOME/theos/sdks"

      # 5. Verify Theos
      - name: Verify RootHide Theos
        shell: bash
        run: |
          set -e

          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/vendor"

          echo "Theos installation OK"

          grep -R -n "roothide" \
            "$THEOS/makefiles" \
            "$THEOS/vendor" 2>/dev/null || true

      # 6. Verify project files
      - name: Verify project structure
        shell: bash
        run: |
          set -e

          REQUIRED_FILES=(
            "Makefile"
            "control"
            "SystemFPS.plist"
            "Tweak.xm"
            "Preferences/Makefile"
            "Preferences/Root.plist"
            "Preferences/SystemFPSRootListController.h"
            "Preferences/SystemFPSRootListController.m"
            "Preferences/Resources/Info.plist"
            "Preferences/Resources/Root.plist"
            "layout/Library/PreferenceLoader/Preferences/SystemFPS.plist"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "ERROR: Missing file: $FILE"
              exit 1
            fi
          done

          echo "All project files found"

      # 7. Verify property lists
      - name: Validate plist files
        shell: bash
        run: |
          set -e

          plutil -lint SystemFPS.plist
          plutil -lint Preferences/Root.plist
          plutil -lint Preferences/Resources/Root.plist
          plutil -lint Preferences/Resources/Info.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/SystemFPS.plist

      # 8. Build RootHide package
      - name: Build SystemFPS RootHide
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=roothide

          make clean
          make package FINALPACKAGE=1

      # 9. Find DEB
      - name: Locate package
        id: package
        shell: bash
        run: |
          set -e

          DEB=$(find packages -maxdepth 1 \
            -name "*.deb" -type f | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB not generated"
            exit 1
          fi

          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

          echo "Generated package: $DEB"

      # 10. Verify package contents
      - name: Verify DEB contents
        shell: bash
        run: |
          set -e

          DEB="${{ steps.package.outputs.deb }}"

          echo "===== PACKAGE INFO ====="
          dpkg-deb --info "$DEB"

          echo "===== PACKAGE FILES ====="
          dpkg-deb -c "$DEB"

          CONTENTS=$(dpkg-deb -c "$DEB")

          echo "$CONTENTS" | grep -q \
            "SystemFPSPrefs.bundle"

          echo "$CONTENTS" | grep -q \
            "PreferenceLoader/Preferences/SystemFPS.plist"

          echo "Preference bundle and registration found"

      # 11. Upload DEB
      - name: Upload SystemFPS DEB
        uses: actions/upload-artifact@v4
        with:
          name: SystemFPS-RootHide-iOS16
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
