
name: Build SystemFPS RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install dependencies
      - name: Install dependencies
        run: |
          brew update
          brew install make dpkg ldid xz

      # 3. Install RootHide Theos without automatic SDK installer
      - name: Install RootHide Theos
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      # 4. Download SDK directly
      - name: Install iOS SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"

          curl -fL --retry 5 --retry-all-errors \
            "$SDK_URL" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            echo "ERROR: SDK installation failed"
            find "$THEOS/sdks" -maxdepth 2 -print
            exit 1
          fi

          echo "iOS SDK installed successfully"

      # 5. Verify RootHide scheme
      - name: Verify RootHide configuration
        shell: bash
        run: |
          set -e

          echo "THEOS: $THEOS"
          echo "Checking RootHide package scheme..."

          grep -R -n "roothide" \
            "$THEOS/makefiles" \
            "$THEOS/vendor" 2>/dev/null || true

          if [ ! -f "$THEOS/makefiles/common.mk" ]; then
            echo "ERROR: Theos common.mk missing"
            exit 1
          fi

          echo "Theos configuration found"

      # 6. Build package
      - name: Build SystemFPS
        shell: bash
        run: |
          set -e

          export THEOS="$HOME/theos"
          export PATH="$THEOS/bin:$PATH"
          export THEOS_PACKAGE_SCHEME=roothide

          make clean
          make package FINALPACKAGE=1

      # 7. Verify DEB
      - name: Verify DEB
        shell: bash
        run: |
          set -e

          DEB=$(find packages -name "*.deb" | head -n 1)

          if [ -z "$DEB" ]; then
            echo "ERROR: DEB not generated"
            exit 1
          fi

          echo "Package: $DEB"

          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"

      # 8. Upload artifact
      - name: Upload SystemFPS RootHide
        uses: actions/upload-artifact@v4
        with:
          name: SystemFPS-RootHide-iOS16
          path: packages/*.deb
          if-no-files-found: error
          retention-days: 30
